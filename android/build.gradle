plugins {
    id 'com.android.application' version '8.13.2'
    id 'com.google.gms.google-services' version '4.4.4'
}

def webAssets = layout.buildDirectory.dir('generated/webAssets')
def copyWebAssets = tasks.register('copyWebAssets', Sync) {
    into webAssets.map { it.dir('web') }
    from(rootDir.parentFile) {
        include 'index.html', 'admin.html', 'app.js', 'styles.css', 'push-sw.js', 'src/**', 'styles/**'
    }
}

android {
    namespace 'com.lifeandtales.instaalternative'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lifeandtales.instaalternative'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }
    def previewKeystore = file('../work/android-build/debug.keystore')
    if (previewKeystore.exists()) {
        signingConfigs.debug {
            storeFile previewKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    sourceSets {
        main {
            manifest.srcFile 'firebase/AndroidManifest.xml'
            java.srcDirs = ['src', 'firebase/src']
            assets.srcDir webAssets
        }
    }
}
tasks.named('preBuild').configure { dependsOn(copyWebAssets) }

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.6.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.webkit:webkit:1.14.0'
}
